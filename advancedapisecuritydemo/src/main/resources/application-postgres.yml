# PostgreSQL profile for the training lab.
#   SPRING_PROFILES_ACTIVE=postgres mvn spring-boot:run
#
# Host/port/credentials are all overridable so nothing clashes with a
# PostgreSQL you may already run on the standard 5432. The default host port is
# 15432 (see docker-compose.yml, which maps the same PG_PORT). If 15432 is also
# taken, pick another and pass it to BOTH the DB and the app, e.g.:
#   PG_PORT=25432 docker compose up -d postgres
#   PG_PORT=25432 SPRING_PROFILES_ACTIVE=postgres mvn spring-boot:run
spring:
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:15432}/${PG_DB:labdb}
    driver-class-name: org.postgresql.Driver
    username: ${PG_USER:lab}
    password: ${PG_PASSWORD:labpw}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-postgresql.sql
      data-locations: classpath:db/data.sql
