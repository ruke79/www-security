server:
  # Overridable at launch to avoid port clashes, e.g.
  #   APP_PORT=29080 mvn spring-boot:run
  #   mvn spring-boot:run -Dspring-boot.run.arguments=--app.port=29080
  # The issuer-uri below tracks the same value, so JWT iss / DPoP htu / the
  # ch11 howToUse command all stay consistent when you change the port.
  port: ${APP_PORT:19080}

spring:
  application:
    name: advanced-api-security-demo

  # MongoDB is only used by the NoSQL-injection lab (mongo profile). Exclude its
  # auto-config by default so the app starts with no MongoDB running. The mongo
  # profile (application-mongo.yml) clears this exclusion.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.mongo.MongoReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoReactiveDataAutoConfiguration

  # Training lab database (SQL-injection / stored-XSS labs). Default profile
  # uses H2 in-memory, so `mvn spring-boot:run` needs no external DB. Switch to
  # a real database with a Spring profile - see application-postgres.yml /
  # application-mysql.yml:
  #   SPRING_PROFILES_ACTIVE=postgres mvn spring-boot:run
  #   SPRING_PROFILES_ACTIVE=mysql    mvn spring-boot:run
  datasource:
    url: jdbc:h2:mem:labdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
      data-locations: classpath:db/data.sql

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    com.example.apisecurity: DEBUG

# ---------------------------------------------------------------------------
# Application-specific settings used across chapter modules.
# ---------------------------------------------------------------------------
app:
  # Issuer used for every JWT minted in this app (Authorization Server + the
  # manually-minted tokens in ch5 / ch8 / ch10), so that a single JwtDecoder
  # can validate all of them (Chapter 7/9 "OAuth 2.0 core / profiles").
  issuer-uri: http://localhost:${APP_PORT:19080}

  # Chapter 4 - Mutual Authentication with TLS.
  # A *second*, dedicated Tomcat connector is opened on this port, configured
  # to request (but not force, at the TLS layer) a client certificate. The
  # actual enforcement ("you MUST present a trusted client certificate") is
  # done by Spring Security's x509() filter chain on /api/ch4/**.
  #
  # Disabled by default so the app always starts even when 8443 is taken and
  # even before you have run certs/generate-certs.sh. Enable it only when you
  # want to exercise Chapter 4:
  #   ./certs/generate-certs.sh          # once, to create the keystores
  #   MTLS_ENABLED=true mvn spring-boot:run
  #   # if 8443 is busy too, pick another: MTLS_ENABLED=true MTLS_PORT=18443 mvn spring-boot:run
  mtls:
    enabled: ${MTLS_ENABLED:false}
    port: ${MTLS_PORT:8443}
    keystore:
      path: certs/server-keystore.p12
      password: changeit
      type: PKCS12
    truststore:
      path: certs/server-truststore.p12
      password: changeit
      type: PKCS12

  # Chapter 2 - Security by Design: simple in-memory rate limiter (DoS control).
  rate-limit:
    capacity: 20
    refill-per-second: 5
